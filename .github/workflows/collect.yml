name: collect

on:
  schedule:
    - cron: "5 * * * *"      # 매시 5분 (UTC 기준이지만 매시간이라 상관없음)
    - cron: "55 14 * * *"    # 한국시간 23:55 마감 수집
  workflow_dispatch:
    inputs:
      max_pages:
        description: "테스트용 페이지 수 제한 (비우면 설정대로)"
        required: false
        default: ""
      only:
        description: "일부 소스만 (예: reddit,9gag)"
        required: false
        default: ""
      save_state:
        description: "수집 기록 저장 (false면 다음 실행 때 같은 글을 다시 수집)"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run collector
        env:
          TZ: Asia/Seoul
          COLLECTOR_STATE_DIR: state
          SEND_ALL_PHOTOS: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          MAX_PAGES: ${{ github.event.inputs.max_pages }}
          ONLY: ${{ github.event.inputs.only }}
        run: python collector.py ${MAX_PAGES:+--max-pages $MAX_PAGES} ${ONLY:+--only $ONLY}
      - name: Save state (seen list)
        if: always() && github.event.inputs.save_state != 'false'
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "state: $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase -q || true
          git push || true
      - name: Upload today's files (7일 보관)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collected-${{ github.run_id }}
          path: |
            data/
            logs/
          retention-days: 7
          if-no-files-found: ignore
